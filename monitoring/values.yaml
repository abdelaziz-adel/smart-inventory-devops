# Small K3s demo: prevent monitoring components missing in single-node K3s.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  service:
    type: NodePort
    nodePort: 30300
  persistence:
    enabled: true
    size: 2Gi

prometheus:
  prometheusSpec:
    retention: 3d
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    resources:
      requests:
        cpu: 150m
        memory: 400Mi
      limits:
        memory: 1Gi
