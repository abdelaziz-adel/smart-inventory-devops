apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: inventory
spec:
  replicas: 1
  selector:
    matchLabels: {app: inventory-frontend}
  template:
    metadata:
      labels: {app: inventory-frontend}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/abdelaziz-adel/smart-inventory-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_UPSTREAM
              value: backend:8000
            - name: ALERTS_UPSTREAM
              value: alerts:8001
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 20m, memory: 40Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: inventory
spec:
  type: NodePort
  selector: {app: inventory-frontend}
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
